<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset>
        <center><h2><b>Hotel Room Booking Form</b></h2></center>
        <form>
            <center>
            <label for="name">Full Name:</label>
            <input type="text" name="name" id="name" placeholder="Enter your name"><br><br>

            <label for="email">Email:</label>
            <input type="email" name="email" id="email" placeholder="Enter your email"><br><br>

            <label for="phone">Phone:</label>
            <input type="tel" name="phone" id="phone" placeholder="Enter Your Number"><br><br>

            <label for="checkin">Check-in Date:</label>
            <input type="date" name="checkin" id="checkin"><br><br>

            <label for="checkout">Check-out Date:</label>
            <input type="date" name="checkout" id="checkout"><br><br>

            <label for="roomtype">Room Type:</label>
            <select name="roomtype" id="roomtype">
                <option value="">Select Room Type</option>
                <option value="single">Single Room</option>
                <option value="double">Double Room</option>
                <option value="suite">Suite</option>
            </select><br><br>

            <label for="guests">Number of Guests:</label>
            <input type="number" name="guests" id="guests"><br><br>
            
            <label for="requests">Special Requests:</label>
            <textarea name="requests" id="requests" ></textarea><br><br>

            <input type="submit" value="Book Now">
            <input type="reset" value="Reset Form">
            </center>
        </form>
    </fieldset>
</body>
</html>
